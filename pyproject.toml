[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "av-label-triage"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "fastapi>=0.110", "uvicorn>=0.27", "PyYAML>=6", "pyarrow>=15", "Pillow>=10", "numpy>=1.26"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
models = ["torch==2.7.1", "transformers==4.52.4", "safetensors==0.5.3", "Pillow==11.2.1", "numpy==2.2.6"]
[project.scripts]
avtriage = "avtriage.cli:app"
[tool.setuptools.packages.find]
include = ["avtriage*", "tools*"]

[tool.setuptools.package-data]
avtriage = ["static/**/*", "static/*"]
